name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release candidate
        run: npm run ci
      - name: Generate checksums
        run: sha256sum origin-single.html > SHA256SUMS
      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: origin-single.html
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" origin-single.html SHA256SUMS --generate-notes --title "ORIGIN ${GITHUB_REF_NAME}"
