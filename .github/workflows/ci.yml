name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Static checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build fixture evidence and standalone site
        run: npm run build
      - name: Verify generated report and transparency log
        run: npm run verify
      - name: Smoke test CLI
        run: node cli/origin.mjs genesis > /tmp/genesis.json
