name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run complete verification pipeline
        run: npm run ci
      - name: Smoke test observatory CLI
        run: node cli/origin.mjs genesis > /tmp/genesis.json
      - name: Smoke test v1 evidence CLI
        run: node cli/origin-v1.mjs help > /tmp/origin-v1-help.txt
      - name: Confirm standalone artifact
        run: test -s origin-single.html
